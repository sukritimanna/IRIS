# BaTiO3 live path T1: Pm-3m -> P4mm (tetragonal, P along [001]). 10-point straight-line irrep path, every number computed during the run (run.mode: live).
# Nothing stored is read: f0 inputs come from the Materials Project (engines/mp_fetch.py -> IRIS_AGENT/live_inputs/batio3_T1/),
# f1 runs ISODISTORT live, f3 writes the VASP inputs and the live executor (python -m iris_agent.live_executor) submits
# them to Carbon (PBS). IRIS writes only under agent_root (enforced in code).
system: batio3
thread_id: batio3_T1_221_99_live
request: "straight-line irrep path BaTiO3 #221 -> #99, amplitudes and strain scaled together, 10 points, DFT PBEsol on Carbon"

run:
  mode: live
  engine: dft
  budget_runs: 20
  allow_live_submission: true     # only honoured with mode: live (config.validate + f3)
  jobs:
    wait: true
    part_size: 5                  # 2 PBS jobs of 5 statics each
  replay:                         # f3 reads the computed points back with the path matcher (same tolerances as HfO2)
    tol_A: 1.0e-3
    tol_lattice_A: 1.0e-4
  live:
    submit_cmd: qsub
    queue_cmd: "qstat -u $USER"
    poll_s: 30
    job_header: |
      #!/bin/bash
      #PBS -A <project-id>
      #PBS -l nodes=1:ppn=32
      #PBS -l walltime=01:00:00
      #PBS -N {job_name}
      #PBS -j oe
      module purge
      module load impi/2019/2019.Update.9
      module load intel/19/19.1.3
      module load hdf5/1.10/intel-19/1.10.8-3
      module load --auto --silent vasp6/6.3
      export OMP_NUM_THREADS=1
      ulimit -s unlimited
      NP=`wc -l < $PBS_NODEFILE`
    vasp_cmd: mpirun -np $NP vasp_std
    potcar_dir: <your-potcar-library>       # writePotcar convention: <dir>/<Element>/POTCAR (Ba, Ti, O subfolders)
    incar:
      SYSTEM: "BaTiO3 T1 static (PBEsol)"
      GGA: PS
      PREC: Accurate
      ENCUT: 600
      EDIFF: 1.0E-7
      ISMEAR: 0
      SIGMA: 0.05
      ISPIN: 1
      NELM: 200
      IBRION: -1
      NSW: 0
      LREAL: false
      LWAVE: false
      LCHARG: false
    kspacing: 0.20                # kpointsUtilities.writeKpoints rule: Gamma mesh, k_i = ceil(|b_i|/0.20), from the lambda = 0 POSCAR

paths:
  repo_root: <your-scratch>/iris_live/imhafo2
  agent_root: <your-scratch>/iris_live/imhafo2/IRIS_AGENT
  test_runs: test_runs
  recovery: recovery_live.yaml                 # live recovery table (the NELM fix is applied to the whole path)
  parent_cif: IRIS_AGENT/live_inputs/batio3_T1/parent.cif       # written by mp_fetch during the demo
  child_cif: IRIS_AGENT/live_inputs/batio3_T1/child.cif
  system_json: demo/staged_walkthrough/systems/batio3.json
  walkthrough: demo/staged_walkthrough
  isodistort_live: IRIS_AGENT/live_runs/batio3/T1/isodistort      # f1 live: raw ISODISTORT responses saved here

expected:
  parent_sg: 221
  child_sg: 99

policy:
  a_thr: 0.05
  amplitude_basis: As_tf
  r5_margin: 0.1
  strain_policy: P5
  d_cut: 1.0
  grid: {q_max: 1.0, dq: 0.1111111111}
  analysis: path
  qc: {mag_max_muB: 0.01}
  path:
    n_points: 10
    child_lattice: {orientation: pure_stretch}      # no stored path to orient against; no rigid rotation
    child_rms_tol: 1.0e-3
    stored: IRIS_AGENT/live_runs/batio3/T1_221-99__lin10     # the computed points (written during the run)
    collected: IRIS_AGENT/live_runs/batio3                      # energies.csv / energies_summary.json (all three paths)

  fit:
    rmax: 1.0
    per_fu: 1                    # f.u. per cell of the child's conventional cell (G4 checks it against the composition)
    cv_folds: 5
    max_rms_meV: 1.0
    max_cv_rms_meV: 1.0
    max_abs_res_meV: 5.0
    min_points_per_coef: 1

retry:
  max_per_node: 3

llm:
  enabled: false
  model: null
  api_key_env: ANTHROPIC_API_KEY
