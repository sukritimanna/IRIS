    - robust_mixing
  rationale: The robust-mixing fix already failed (history); repeating it or resubmitting unchanged will fail again.
  fault: F011
- id: C09
  split: seed
  title: densify was tried and now the grid exceeds the budget
  class: used_up
  system: cssni3
  fault: F006
  expect:
    node: f2
    code: OVER_BUDGET
  labels:
    correct:
