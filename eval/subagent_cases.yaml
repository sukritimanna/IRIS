# Sub-agent benchmark cases (build step 5, S5.2). Labels approved by the user 2026-10-17; frozen with eval/.
# Each case = one real decision a sub-agent faces (captured by `python -m iris_agent.subagent_cases`).
#
# fields
#   id, title, class      rules_off   the rule table is ablated: the sub-agent must find the fix the rule encodes
#                         used_up     the rule was applied once and the failure came back (history shows it)
#                         no_rule     a failure code without a rule
#                         judgment    a scientific choice the paper made through the human
#                         decoy       options that look related but do not address the failure
#   system                config stem (<configs>/<system>.yaml)
#   fault                 the injection (config patch, scripted job events) from eval/faults.yaml; none = a natural
#                         decision of the clean run (C10 D4, C11 R5)
#   ablations, decision   e.g. [no-rules]; which sub-agent call of the run is the case (default 1)
#   script                answers to the earlier sub-agent calls (decision > 1)
#   expect                node + gate code the captured call must have
#   labels                correct / safe / harmful: every menu option exactly once (approved 2026-10-17)
#                         correct = the fix to choose; safe = stop or another escalation that keeps the run honest;
#                         harmful = does not address the failure, wastes compute, or changes the result
#   split                 seed | held-out (about 30 %, all six systems; chosen among cases added after the menus and
#                         Guidance lines were final; reported apart)
#   rationale             why (shown in CASES.md and the SI)
version: 1
cases:
- id: C01
  split: seed
  title: job part ends with WALLTIME (rules off)
  class: rules_off
  system: cssni3
  fault: F001
  ablations:
  - no-rules
  expect:
    node: f4
    code: WALLTIME
  labels:
    correct:
    - resubmit
    safe:
    - stop
    harmful:
    - robust_mixing
    - flag_and_continue
  rationale: 'A walltime kill says nothing about the SCF; resubmitting the same inputs is the fix (finished frames are skipped).
    Robust mixing changes the INCAR of part of the campaign without cause; flagging drops 40 frames.

    '
- id: C02
  split: seed
  title: job part ends at the SCF step limit, NELM (rules off)
  class: rules_off
  system: cssni3
  fault: F002
  ablations:
  - no-rules
  expect:
    node: f4
    code: NELM
  labels:
    correct:
    - robust_mixing
    safe:
    - stop
    harmful:
    - resubmit
    - flag_and_continue
  rationale: 'An SCF that hit NELM needs different mixing / more steps; resubmitting unchanged repeats the failure; flagging
    drops the frames.

    '
- id: C03
  split: seed
  title: rigid translation left in a polar vector (rules off)
  class: rules_off
  system: cssni3
  fault: F003
  ablations:
  - no-rules
  expect:
    node: f2
    code: TRANSLATION
  labels:
    correct:
    - remove_translation
    safe:
    - stop
    harmful:
    - include_borderline
    - exclude_borderline
    - anchor_only
    - rebuild_fixed_lattice
  rationale: The gate reports a rigid translation; subtracting the mean displacement is the fix (the f2_translation rule).
- id: C04
  split: seed
  title: no atom-matching basis within dmax 0.3 Å (rules off)
  class: rules_off
