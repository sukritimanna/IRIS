  rationale: The child shear on the movie frame gives Pbam
- id: C06
  split: seed
  title: grid too thin for the fit (points per coefficient), rules off
  class: rules_off
  system: cssni3
  fault: F006
  ablations:
  - no-rules
  expect:
    node: f5
    code: THIN_GRID
  labels:
    correct:
    - densify
    safe:
    - stop
    harmful:
    - accept_secondary_hold
  rationale: 'Coverage failure goes back to f2 to densify (Methods). In replay the densified frames are not stored, so the
    run then stops at the budget/unmatched check — the decision is still the right one.

    '
- id: C07
  split: seed
  title: WALLTIME again after the resubmit rule
  class: used_up
  system: cssni3
  expect:
    node: f4
    code: WALLTIME
  labels:
    correct:
    - stop
    safe:
    - flag_and_continue
    - resubmit
    harmful:
    - robust_mixing
  rationale: 'The same part ran out of time twice: a human should look (walltime or part size); flagging keeps the run going
    with a hole that G5 will see; one more resubmit is defensible (both safe). Robust mixing does not address time.

    '
  fault: F010
