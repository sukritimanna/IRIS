    safe: []
    harmful:
    - include_borderline
    - exclude_borderline
    - anchor_only
    - rebuild_fixed_lattice
    - remove_translation
  rationale: 'The budget is the user''s limit; none of the f2 options reduces the grid (R5 options do not apply — no borderline
    irreps). Only the human can raise the budget or relax the coverage target.

    '
- id: C10
  split: seed
  title: a held-at-zero secondary would release more energy than the ring corrugation (D4, CsSnI3 X5+)
  class: judgment
  system: cssni3_d4
  expect:
    node: f5
    code: SECONDARY_COUPLED
  labels:
    correct:
    - accept_secondary_hold
    safe:
    - stop
    harmful:
    - densify
  rationale: 'The plane holds X5+ at zero by construction; the paper reports the energy it would release (1.92 vs a 1.38 meV/f.u.
    corrugation) as a caveat (user decision 2026-10-17). Densifying the plane cannot address a missing coordinate.

    '
