    - event: job_end
      parts: all
      failed:
        '7': NELM
    - all
  expected:
    gate: G4 NELM
    failures:
    - - f4
      - NELM
    fixes:
    - - rule
      - f4_nelm_robust_mixing
      - f3
    final: completed
    n_submissions: 2
    baseline: true
- id: F003
  name: translation
  class: vectors
  system: cssni3
  split: seed
  description: rigid translation of 0.05 Å/atom left in the M3+ vector (removal switched off)
  injection:
    patch:
      policy.remove_translation: false
      faults.inject_translation:
        irrep: M3+
        A_per_atom: 0.05
    jobs:
    - all
  expected:
    gate: G2 TRANSLATION
    failures:
    - - f2
      - TRANSLATION
    fixes:
    - - rule
      - f2_translation
      - f2
    final: completed
    n_submissions: 1
    baseline: true
- id: F004
  name: no_basis
