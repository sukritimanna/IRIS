    n_submissions: 1
    baseline: true
- id: F006
  name: thin_grid
  class: analysis
  system: cssni3
  split: seed
  description: G5 coverage demands 100 points per coefficient (800 > 545 in the fit)
  injection:
    patch:
      policy.fit.min_points_per_coef: 100
    jobs:
    - all
    human:
    - option: stop
  expected:
    gate: G5 THIN_GRID
    failures:
    - - f5
      - THIN_GRID
    - - f2
      - OVER_BUDGET
    fixes:
    - - rule
      - f5_thin_grid_densify
      - f2
    - - human
      - null
      - END
    final: stopped
    n_submissions: 1
    baseline: false
